<head>
<meta charset="utf-8">

<meta name="robots" content="noindex,nofollow">
<title>Redirecionando...</title>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');

<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#fff;font-family:Arial,sans-serif;padding:24px}.card{width:100%;max-width:460px;text-align:center;background:#171a20;border:1px solid #262a33;border-radius:24px;padding:40px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{margin:0 0 10px;font-size:27px}p{color:#a8afbd}.circle{width:128px;height:128px;margin:30px auto;border:5px solid #25D366;border-radius:50%;display:flex;align-items:center;justify-content:center}#counter{font-size:64px;font-weight:800}a{display:inline-block;width:100%;padding:15px 18px;border-radius:12px;background:#25D366;color:#07160d;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<h1>Estamos te direcionando</h1>
<p>Em instantes, você será enviado para o grupo no WhatsApp.</p>
<div class="circle"><div id="counter">3</div></div>
<p id="status">Preparando seu acesso...</p>
<a id="btn" href="/whatsapp.html">Entrar no grupo agora</a>
</main>
<script>
const q=window.location.search||"";
const next="/whatsapp.html"+q;
document.getElementById("btn").href=next;
let s=3;
const c=document.getElementById("counter");
const st=document.getElementById("status");
const m={2:"Quase lá...",1:"Abrindo o WhatsApp..."};
const t=setInterval(()=>{
 s--;
 if(s>0){c.textContent=s;st.textContent=m[s];return;}
 clearInterval(t);c.textContent="✓";st.textContent="Redirecionando...";
 window.location.href=next;
},1000);
</script>
</body>
</html>
